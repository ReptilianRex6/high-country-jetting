name: Firebase live (enable at launch)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
        env:
          SITE_ENV: production
          BASE_PATH: ''
      - run: npm run check
      - run: echo 'Live deployment is intentionally disabled until client approval and domain launch.'
